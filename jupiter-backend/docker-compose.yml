name: jupiter_backend

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: jupiter_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jupiter_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jupiter_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Jupiter Backend API Service
  backend:
    image: jupiter_backend:latest
    container_name: jupiter_backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5026:5026"
    environment:
      PORT: 5026
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jupiter_db?schema=public
      FRONTEND_URL: http://localhost:3026
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
