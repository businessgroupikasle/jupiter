# ==============================================================================
# Jupiter Industries - Production Nginx Configuration (Ubuntu / Nginx 1.24+)
# Optimized for Lighthouse 100/100, Core Web Vitals, Sub-2.5s LCP & Caching
#
# Deployment Instructions:
# 1. Place this configuration in /etc/nginx/sites-available/jupitergroups.in
# 2. Link to sites-enabled: ln -s /etc/nginx/sites-available/jupitergroups.in /etc/nginx/sites-enabled/
# 3. Test configuration: sudo nginx -t
# 4. Reload Nginx: sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name jupitergroups.in www.jupitergroups.in;
    return 301 https://jupitergroups.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jupitergroups.in;

    # Legacy URL 301 Redirects (direct single hop)
    location = /about.html {
        return 301 https://jupitergroups.in/about-us;
    }

    location = /products.html {
        return 301 https://jupitergroups.in/products;
    }

    location / {
        return 301 https://jupitergroups.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jupitergroups.in;

    root /var/www/jupiter/jupiter-frontend/dist;
    index index.html;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/jupitergroups.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jupitergroups.in/privkey.pem;

    # 1. Gzip Compression (Drastically reduces FCP/LCP transfer size)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2
        font/woff
        font/ttf;

    # 2. Strict Caching for Static Fingerprinted Assets (/assets/*.js, *.css)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 3. Strict Caching for Images, WebP, Fonts & Media (/images/, /favicon.png)
    location ~* \.(?:webp|png|jpg|jpeg|gif|svg|ico|woff2|woff|ttf|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 4. Backend API & Uploads Proxy
    location /api/ {
        proxy_pass http://localhost:5026/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://localhost:5026/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 5. HTML Entry Point - Never cache index.html so updates propagate immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 5b. Legacy Website URLs 301 Redirects (BUG 03)
    location = /about.html {
        return 301 https://jupitergroups.in/about-us;
    }

    location = /products.html {
        return 301 https://jupitergroups.in/products;
    }

    # 6. SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 7. Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
